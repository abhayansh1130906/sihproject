services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillintel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/skillintel}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_in_production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEMO_LOGIN_PASSWORD=${DEMO_LOGIN_PASSWORD:-demopassword}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AUTO_SEED=${AUTO_SEED:-true}
      - WEB_CONCURRENCY=2
    depends_on:
      db:
        condition: service_healthy
        required: false
    networks:
      - skillintel-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        - NEXT_PUBLIC_DEMO_LOGIN_PASSWORD=${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-demopassword}
    container_name: skillintel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - skillintel-network

  # Optional local PostgreSQL service (only needed if NOT using AWS RDS or remote Neon DB)
  db:
    image: postgres:16-alpine
    container_name: skillintel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillintel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillintel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillintel-network

volumes:
  postgres_data:

networks:
  skillintel-network:
    driver: bridge
