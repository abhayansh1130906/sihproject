services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: skillintel_nginx_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - skillintel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillintel_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEMO_LOGIN_PASSWORD=${DEMO_LOGIN_PASSWORD:-demopassword}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - AUTO_SEED=${AUTO_SEED:-true}
      - WEB_CONCURRENCY=2
    networks:
      - skillintel-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
        - NEXT_PUBLIC_DEMO_LOGIN_PASSWORD=${NEXT_PUBLIC_DEMO_LOGIN_PASSWORD:-demopassword}
    container_name: skillintel_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    networks:
      - skillintel-network

networks:
  skillintel-network:
    driver: bridge
